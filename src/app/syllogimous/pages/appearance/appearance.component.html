<div class="appearance">

    <h2 class="mb-1">Appearance</h2>
    <p class="text-muted mb-3">Changes apply instantly and are remembered on this device.</p>

    <div class="card p-3 mb-3">
        <h5 class="mb-2">Presets</h5>
        <div class="preset-row">
            <button *ngFor="let p of presets"
                    class="btn btn-sm"
                    (click)="applyPreset(p)">{{ p }}</button>
        </div>
    </div>

    <div class="card p-3 mb-3" *ngFor="let group of groups">
        <h5 class="mb-3">{{ group.name }}</h5>

        <div class="control" *ngFor="let c of group.controls">
            <label [attr.for]="c.key">
                {{ c.label }}
                <small class="text-muted d-block" *ngIf="c.hint">{{ c.hint }}</small>
            </label>

            <ng-container [ngSwitch]="c.kind">

                <input *ngSwitchCase="'color'"
                       type="color"
                       [id]="c.key"
                       [value]="theme[c.key]"
                       (input)="onChange(c.key, $any($event.target).value)">

                <span *ngSwitchCase="'range'" class="range-wrap">
                    <input type="range"
                           class="form-range"
                           [id]="c.key"
                           [min]="c.min" [max]="c.max" [step]="c.step"
                           [value]="theme[c.key]"
                           (input)="onRange(c.key, $any($event.target).value)">
                    <output>{{ theme[c.key] }}{{ c.unit }}</output>
                </span>

                <input *ngSwitchCase="'text'"
                       type="text"
                       class="form-control"
                       [id]="c.key"
                       [value]="theme[c.key]"
                       (change)="onChange(c.key, $any($event.target).value)">

            </ng-container>
        </div>
    </div>

    <div class="card p-3 mb-3">
        <h5 class="mb-2">Preview</h5>
        <p class="mb-2">
            When <span class="subject">I</span> am here,
            <span class="subject">I</span> hold <span class="subject">KAV</span>
        </p>
        <div class="preset-row">
            <button class="btn btn-sm btn-primary">True</button>
            <button class="btn btn-sm btn-danger">False</button>
            <span class="badge align-self-center">Adept</span>
        </div>
    </div>

    <div class="card p-3">
        <h5 class="mb-2">Share &amp; reset</h5>
        <div class="preset-row">
            <button class="btn btn-sm" (click)="copyJson()">Copy theme JSON</button>
            <button class="btn btn-sm" (click)="importOpen = !importOpen">Import…</button>
            <button class="btn btn-sm btn-danger" (click)="reset()">Reset to default</button>
        </div>

        <div *ngIf="importOpen" class="mt-3">
            <textarea class="form-control" rows="6"
                      placeholder="Paste theme JSON"
                      (input)="importText = $any($event.target).value"></textarea>
            <div class="text-danger mt-1" *ngIf="importError">{{ importError }}</div>
            <button class="btn btn-sm btn-primary mt-2" (click)="doImport()">Apply</button>
        </div>
    </div>

</div>
