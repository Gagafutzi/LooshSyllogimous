<app-card>
    <div body class="d-grid gap-3 py-3 px-md-3" style="min-width: 320px;">
        <app-tier-stats></app-tier-stats>
        <app-accuracy-stats></app-accuracy-stats>
        <app-time-based-stats></app-time-based-stats>
        <app-type-based-stats></app-type-based-stats>
        <app-error-analysis></app-error-analysis>
        <app-dimension-stats></app-dimension-stats>
    </div>

    <div footer class="playcard-toolbar">
        <div>
            <button
                class="btn btn-outline-primary"
                (click)="router.navigate([EnumScreens.Start])"
            >
                <i class="bi bi-arrow-left"></i> Start
            </button>
        </div>
        <div>
            <button 
                class="btn btn-outline-primary" 
                (click)="exportStats()"
            >
                <i class="bi bi-download"></i> Export CSV
            </button>
            <button class="btn btn-outline-primary" (click)="buildShare()">
                <i class="bi bi-share"></i> Share results
            </button>
        </div>
    </div>

    <!--
      Shown before it can be copied, and copied only on a second click. What is
      published cannot be unpublished, so reading it first is the whole point.
    -->
    <div class="share" *ngIf="shareReport">
        <p class="share__note">
            Everything below is what gets copied — no dates, no times, no
            per-question rows.
        </p>
        <pre class="share__body">{{ shareReport.text }}

{{ shareReport.json }}</pre>
        <div class="share__actions">
            <button class="btn btn-outline-primary" (click)="copyShare()">
                {{ shareCopied ? "Copied" : "Copy" }}
            </button>
            <button class="btn btn-outline-secondary" (click)="shareReport = null">
                Close
            </button>
        </div>
    </div>
</app-card>
