<app-card>
    <div body class="py-3 px-md-3">
        <router-outlet class="d-none"></router-outlet>
    </div>

    <div *ngIf="!showBack; else showBackTemplate" footer class="playcard-toolbar tut__footer">
        <div class="tut__checks">
            <div class="form-check">
                <input #dontShowAnymore class="form-check-input" type="checkbox" value="" id="dontShowAnymore">
                <label class="form-check-label" for="dontShowAnymore">
                    Don't show anymore
                </label>
            </div>

            <!--
              Offered here as well as on the intro, because this is the screen
              you are on when you decide you never want to see one again.
            -->
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="skipAllTutorials"
                       [checked]="game.skipAllTutorials"
                       (change)="game.skipAllTutorials = $any($event.target).checked">
                <label class="form-check-label" for="skipAllTutorials">
                    Skip all tutorials
                </label>
            </div>
        </div>
        <div>
            <button
                class="btn btn-outline-primary"
                (click)="game.skipTutorial(dontShowAnymore.checked)"
            >Skip Tutorial</button>
        </div>
    </div>
    <ng-template #showBackTemplate>
        <div footer class="playcard-toolbar">
            <div>
                <button
                    class="btn btn-outline-primary"
                    (click)="router.navigate([EnumScreens.Tutorials])"
                >
                    <i class="bi bi-arrow-left"></i> Tutorials
                </button>
            </div>
        </div>
    </ng-template>
</app-card>
