<app-card>
    <div body class="d-grid py-3 px-md-3" style="gap: 2rem;">
        <!--
          Named for what it does rather than for how important it sounds: how a
          question is shown, how long you get, and what you are aiming for. What
          a question *is* lives on Customise.
        -->
        <div>
            <h2 class="mb-1">Display &amp; timer</h2>
            <p class="text-muted small mb-0">
                How questions look and how long you get. Which questions you get is
                under <strong>Customise</strong>.
            </p>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">How premises are shown</div>
            <div class="card-body">
                <app-game-mode-choose></app-game-mode-choose>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Timer mode</div>
            <div class="card-body">
                <app-timer-choose></app-timer-choose>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Keyboard</div>
            <div class="card-body">
                <app-keybind-choose></app-keybind-choose>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Accessibility</div>
            <div class="card-body">
                <div class="d-grid" style="gap: 0.75rem;">
                    <app-input
                        type="select"
                        name="colorBlindnessMode"
                        label="Color blindness mode"
                        placeholder="Color blindness mode"
                        [ngControl]="colorBlindnessMode"
                        [options]="colorBlindnessChoices"
                    />
                    <p class="text-muted small">This changes the color of the <span class="is-negated">inversion cue</span></p>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Playtime settings</div>
            <div class="card-body">
                <div class="d-grid" style="gap: 0.75rem;">
                    <app-input
                        type="range"
                        min="15"
                        max="60"
                        step="5"
                        name="dailyProgressMinutes"
                        [label]="'Daily goal: ' + dailyProgressMinutes.value + ' minutes'"
                        [ngControl]="dailyProgressMinutes"
                        [noParenthesisValue]="true"
                    ></app-input>
            
                    <app-input
                        type="range"
                        min="60"
                        max="240"
                        step="5"
                        name="weeklyProgressMinutes"
                        [label]="'Weekly goal: ' + weeklyProgressMinutes.value + ' minutes'"
                        [ngControl]="weeklyProgressMinutes"
                        [noParenthesisValue]="true"
                    ></app-input>
                </div>
            </div>
        </div>

    </div>

    <div footer class="playcard-toolbar">
        <button
            class="btn btn-outline-primary"
            (click)="router.navigate([EnumScreens.Start])"
        >
            <i class="bi bi-arrow-left"></i> Start
        </button>
        <div>
            <button
                class="btn btn-primary"
                (click)="game.playArcadeMode()"
            >
                Play <i class="bi bi-play-fill"></i>
            </button>
        </div>
    </div>
</app-card>
