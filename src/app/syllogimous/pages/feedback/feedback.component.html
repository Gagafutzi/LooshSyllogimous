<app-card>
    <div body>
        <app-progress-and-performance
            [feedbackPage]="true"
            [playgroundMode]="game.question.playgroundMode"
        ></app-progress-and-performance>

        <div
            *ngIf="{
                timeout: game.question.userAnswer === undefined,
                validity: itemWasRight(game.question)
            } as d"
            class="feedback-wrap"
            [class.feedback-timeout]="d.timeout"
            [class.feedback-correct]="!d.timeout && d.validity"
            [class.feedback-incorrect]="!d.timeout && !d.validity"
        >
            <div class="fs-1 fw-bold text-uppercase">
                {{ d.timeout ? "Timeout" : d.validity ? "Correct": "Incorrect" }}
            </div>
            <!-- Which of them, for an item that asked more than one. -->
            <div class="fs-6" *ngIf="tally(game.question).asked > 1">
                {{ tally(game.question).right }} of {{ tally(game.question).asked }} conclusions right
            </div>
        </div>
    </div>

    <div footer class="playcard-toolbar">
        <div>
            <button
                class="btn btn-outline-primary"
                (click)="router.navigate([EnumScreens.Start]);"
            >
                <i class="bi bi-arrow-left"></i> Start
            </button>
        </div>
        <div>
            <button class="btn btn-primary" (click)="game.play()">
                Play <i class="bi bi-play-fill"></i>
            </button>
        </div>
    </div>
</app-card>
