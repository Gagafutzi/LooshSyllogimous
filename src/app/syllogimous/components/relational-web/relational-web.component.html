<svg class="web" [attr.viewBox]="'0 0 ' + size + ' ' + size" role="img"
     aria-label="A web of nodes joined by arrows">
    <defs>
        <!-- context-stroke keeps the head the same colour as its line. -->
        <marker id="web-head" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
        </marker>
    </defs>

    <line class="web__arrow" *ngFor="let a of arrows"
          [attr.x1]="a.x1" [attr.y1]="a.y1" [attr.x2]="a.x2" [attr.y2]="a.y2"
          marker-end="url(#web-head)"
          [attr.marker-start]="a.both ? 'url(#web-head)' : null"/>

    <!-- Self-arrows, which is what reflexivity looks like. -->
    <circle class="web__loop" *ngFor="let l of loops"
            [attr.cx]="l.x" [attr.cy]="l.y - radius" [attr.r]="radius * 0.55"/>

    <g *ngFor="let n of nodes" [class.web__pickable]="selectable"
       (click)="selectable && pick.emit(n.index)">
        <!--
          A wider invisible disc under each node, so pointing at one is not a
          test of aim. The drawn radius is tuned for legibility, not for thumbs.
        -->
        <circle *ngIf="selectable" class="web__target"
                [attr.cx]="n.x" [attr.cy]="n.y" [attr.r]="radius * 1.8"/>

        <circle class="web__node"
                [class.is-lit]="n.lit"
                [class.is-marked]="n.mark >= 0"
                [style.stroke]="n.mark >= 0 ? markColor(n.mark) : null"
                [style.fill]="n.mark >= 0 ? markFill(n.mark) : null"
                [attr.cx]="n.x" [attr.cy]="n.y" [attr.r]="radius"/>

        <text class="web__label" [class.is-lit]="n.lit"
              [attr.x]="n.x" [attr.y]="n.y">{{ n.label }}</text>

        <!--
          The position in the order, not the node's name. Colour alone would
          carry it, but colour alone is no use to a reader who cannot separate
          two of them.
        -->
        <text *ngIf="n.mark >= 0" class="web__order"
              [style.fill]="markColor(n.mark)"
              [attr.x]="n.x + radius * 1.15" [attr.y]="n.y - radius * 0.9">{{ n.mark + 1 }}</text>
    </g>
</svg>
